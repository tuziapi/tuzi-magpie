name: Tuzi download page (manual)

# Deliberately manual: no release, push or client-package workflow triggers.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish to GitHub Pages (requires owner approval and Pages Actions setup)'
        type: boolean
        default: false
      release_tag:
        description: 'Optional stable vX.Y.Z; empty uses latest official release'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: tuzi-github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'tuziapi/tuzi-magpie' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/download-page
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/download-page/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - run: npm run build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
      - name: Include corresponding page source and notices
        working-directory: .
        run: |
          git archive --format=tar.gz --output=packages/download-page/dist/source.tar.gz HEAD packages/download-page internal/gui/assets internal/gui/tests/tuzi-account.test.cjs LICENSE THIRD_PARTY_NOTICES
          cp packages/download-page/SOURCE.json packages/download-page/dist/SOURCE.json
          cp packages/download-page/LICENSE packages/download-page/dist/LICENSE.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/download-page/dist
  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # configure-pages is intentionally absent: this workflow never enables or
      # reconfigures Pages. The owner must choose Actions before deployment.
      - uses: actions/deploy-pages@v4
        id: deployment
